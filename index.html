defCalc({id:'ACC', no:'CS-RD-002', title:'Main Access — Geometry, Swept Path & Sight Distance', module:'m22', req:[],
  purpose:'Check main access gradient, swept width for the design vehicle and junction stopping sight distance.',
  codes:['ATJ886'],
  assume:['Off-tracking OT = R − √(R² − ΣL_i²).','SSD = 0.278Vt + V²/(254(f ± G)).'],
  criteria:['Gradient ≤ limit; swept width ≤ carriageway width at bend; SSD_available ≥ SSD_required'],
  inputs:[
    {k:'G', sym:'G', l:'Maximum access gradient', u:'%', d:4.5, c:'Surveyed'},
    {k:'Gl', sym:'G_lim', l:'Gradient limit (low-loader)', u:'%', d:8, c:'Consultant Assumption', s:'ATJ 8/86 / transporter — VERIFY'},
    {k:'R', sym:'R', l:'Outer turning radius at junction', u:'m', d:20, c:'Consultant Assumption'},
    {k:'L1', sym:'L₁', l:'Tractor wheelbase', u:'m', d:4.5, c:'Vendor Certified'},
    {k:'L2', sym:'L₂', l:'King-pin to trailer bogie centre', u:'m', d:12.0, c:'Vendor Certified'},
    {k:'wv', sym:'w_v', l:'Vehicle width', u:'m', d:3.0, c:'Vendor Certified'},
    {k:'wc', sym:'w_c', l:'Carriageway width at bend (incl. widening)', u:'m', d:9.0, c:'Consultant Assumption'},
    {k:'V', sym:'V', l:'Design speed on public road', u:'km/h', d:60, c:'Authority Data'},
    {k:'t', sym:'t', l:'Perception-reaction time', u:'s', d:2.5, c:'Consultant Assumption'},
    {k:'f', sym:'f', l:'Longitudinal friction', u:'', d:0.35, c:'Consultant Assumption'},
    {k:'SSDa', sym:'SSD_av', l:'Available sight distance', u:'m', d:120, c:'Estimated'},
  ],
  run(I, S){
    S.chk({label:'Access gradient', val: I.G, lim: I.Gl, rel:'<=', unit:'%', dp:1});
    const OT = S.v('OT', 'Off-tracking', 'OT = R − √(R² − L₁² − L₂²)', `${I.R} − √(${I.R}² − ${I.L1}² − ${I.L2}²)`, I.R - Math.sqrt(Math.max(I.R**2 - I.L1**2 - I.L2**2, 0)), 'm', '', 2);
    const sw = S.v('w_s', 'Swept width', 'w_s = w_v + OT + 0.6 clearance', `${I.wv} + ${f2(OT)} + 0.6`, I.wv + OT + 0.6, 'm', '', 2);
    S.chk({label:'Swept width ≤ carriageway at bend', val: sw, lim: I.wc, rel:'<=', unit:'m', dp:2, fix:'Increase curve widening / junction radius.'});
    const ssd = S.v('SSD', 'Stopping sight distance', 'SSD = 0.278Vt + V²/(254f)', `0.278×${I.V}×${I.t} + ${I.V}²/(254×${I.f})`, 0.278 * I.V * I.t + I.V**2 / (254 * I.f), 'm', 'ATJ886 (VERIFY)', 1);
    S.chk({label:'Sight distance at junction', val: I.SSDa, lim: ssd, rel:'>=', unit:'m', dp:0, kind:'cap', what:'available sight distance', dem:'required stopping sight distance', fix:'Clear sight lines / relocate access.'});
    S.r('OT', 'Off-tracking', OT, 'm', 2); S.r('ssd', 'SSD required', ssd, 'm', 1);
    S.w('AUTH', 'Access junction to public road requires JKR / PBT approval (junction layout per ATJ).');

defCalc({id:'RDQ', no:'CS-RD-003', title:'Road Quantities (Main Access & Internal Roads)', module:'m23', req:[45],
  purpose:'Compute road pavement quantities from alignment lengths, widths and layer thicknesses.',
  codes:['JKR_SPJ','ATJ585'],
  assume:['Layer widths = carriageway + shoulders; geotextile under full width.'],
  criteria:['Crossfall 3% to road-side drains'],
  inputs:[
    {k:'Lm', sym:'L_m', l:'Main access length', u:'m', d:650, c:'Estimated'},
    {k:'wm', sym:'w_m', l:'Main access carriageway', u:'m', d:7.0, c:'Client Provided'},
    {k:'Li', sym:'L_i', l:'Internal road length', u:'m', d:9800, c:'Estimated', s:'From PV layout'},
    {k:'wi', sym:'w_i', l:'Internal road carriageway', u:'m', d:4.0, c:'Client Provided'},
    {k:'sh', sym:'s', l:'Shoulder width (each side)', u:'m', d:0.5, c:'Consultant Assumption'},
    {k:'tb', sym:'t_b', l:'Base', u:'mm', d:150, link:'PAV.tBase'},
    {k:'ts', sym:'t_s', l:'Sub-base', u:'mm', d:250, link:'PAV.tSub'},
    {k:'ac', sym:'—', l:'Bituminous surfacing on main access', t:'s', o:['Yes','No'], d:'Yes', c:'Client Provided'},
  ],
  run(I, S){
    const Am = S.v('A_m', 'Main access area', 'L_m(w_m + 2s)', `${I.Lm}(${I.wm} + 2×${I.sh})`, I.Lm * (I.wm + 2 * I.sh), 'm²', '', 0);
    const Ai = S.v('A_i', 'Internal road area', 'L_i(w_i + 2s)', `${I.Li}(${I.wi} + 2×${I.sh})`, I.Li * (I.wi + 2 * I.sh), 'm²', '', 0);
    const At = Am + Ai;
    const Vs = S.v('V_sb', 'Sub-base', '(A_m + A_i)·t_s', `${f0(At)}×${I.ts/1000}`, At * I.ts / 1000, 'm³', '', 0);
    const Vb = S.v('V_b', 'Base', '(A_m + A_i)·t_b', `${f0(At)}×${I.tb/1000}`, At * I.tb / 1000, 'm³', '', 0);
    S.r('area', 'Road area', At, 'm²', 0); S.r('Vsub', 'Sub-base', Vs, 'm³', 0); S.r('Vbase', 'Base', Vb, 'm³', 0); S.r('Lroad', 'Total road length', I.Lm + I.Li, 'm', 0);
    S.q('RD_SUBGRADE', At); S.q('RD_GEOTEX', At); S.q('RD_SUBBASE', Vs); S.q('RD_BASE', Vb); if (I.ac === 'Yes') S.q('RD_AC', I.Lm * I.wm);
    S.p(`Main access ${I.Lm} m × ${I.wm} m (bituminous), internal roads ${I.Li} m × ${I.wi} m (granular).`);
  }});

defCalc({id:'HVY', no:'CS-RD-004', title:'Heavy Transport Check (Main Transformer Delivery)', module:'m24', req:[36],
  purpose:'Check the transport route and site roads for the heaviest delivery: axle loads, crossings, gradients and clearances.',
  codes:['ATJ886','JKR_SPJ','TNB_TG'],
  assume:['Axle load uniformly distributed over axle lines of modular trailer.','Crossing ratings to be confirmed by structural assessment.'],
  criteria:['Axle load ≤ road / culvert rating; gradient ≤ limit; clearances ≥ vehicle + margin'],
  inputs:[
    {k:'GVW', sym:'GVW', l:'Gross vehicle weight', u:'kN', d:1900, c:'Contractor Provided', s:'Transformer 120 t + trailer'},
    {k:'na', sym:'n_a', l:'Number of trailer axle lines', u:'no.', d:12, c:'Contractor Provided'},
    {k:'tr', sym:'W_tr', l:'Tractor share of GVW', u:'kN', d:260, c:'Contractor Provided'},
    {k:'as', sym:'s_a', l:'Axle spacing', u:'m', d:1.5, c:'Contractor Provided'},
    {k:'p', sym:'p', l:'Tyre pressure', u:'kPa', d:800, c:'Contractor Provided'},
    {k:'Lv', sym:'L_v', l:'Vehicle length', u:'m', d:32, c:'Contractor Provided'},
    {k:'Wv', sym:'W_v', l:'Vehicle width', u:'m', d:3.5, c:'Contractor Provided'},
    {k:'Hv', sym:'H_v', l:'Loaded height', u:'m', d:4.9, c:'Contractor Provided'},
    {k:'R', sym:'R', l:'Tightest turning radius', u:'m', d:40, c:'Estimated'},
    {k:'Lwb', sym:'L_wb', l:'Effective wheelbase', u:'m', d:18, c:'Contractor Provided'},
    {k:'rate', sym:'P_rate', l:'Road / culvert crossing axle rating', u:'kN', d:160, c:'Estimated', s:'Crossing assessment required'},
    {k:'Gmax', sym:'G', l:'Steepest route gradient', u:'%', d:4.5, link:'ACC.G'},
    {k:'Gl', sym:'G_lim', l:'Gradient limit for transporter', u:'%', d:6, c:'Contractor Provided'},
    {k:'Hc', sym:'H_c', l:'Min. vertical clearance on route', u:'m', d:5.8, c:'Estimated', s:'Overhead lines — TNB'},
    {k:'Wc', sym:'W_c', l:'Min. horizontal clearance (gates, bends)', u:'m', d:9.0, c:'Estimated'},
  ],
  run(I, S){
    const ax = S.v('P_ax', 'Trailer axle-line load', 'P = (GVW − W_tr)/n_a', `(${I.GVW} − ${I.tr})/${I.na}`, (I.GVW - I.tr) / I.na, 'kN', '', 1);
    S.chk({label:'Axle load vs crossing rating', val: ax, lim: I.rate, rel:'<=', unit:'kN', dp:1, fix:'Increase axle lines, bridge crossings with steel plates / temporary bridge, or strengthen culverts.'});
    S.v('A_t', 'Tyre contact area per axle line', 'A = P/p', `${f1(ax)}/${I.p}`, ax / I.p, 'm²', '', 3);
    S.chk({label:'Route gradient', val: I.Gmax, lim: I.Gl, rel:'<=', unit:'%', dp:1});
    S.chk({label:'Vertical clearance', val: I.Hc, lim: I.Hv + 0.5, rel:'>=', unit:'m', dp:2, fix:'Coordinate TNB line lifting / route change.'});
    const OT = S.v('OT', 'Off-tracking at R', 'OT = R − √(R² − L_wb²)', `${I.R} − √(${I.R}² − ${I.Lwb}²)`, I.R - Math.sqrt(Math.max(I.R**2 - I.Lwb**2, 0)), 'm', '', 2);
    S.chk({label:'Horizontal clearance incl. off-tracking', val: I.Wc, lim: I.Wv + OT + 0.5, rel:'>=', unit:'m', dp:2, fix:'Widen bends / gate openings; steerable trailer.'});
    S.r('ax', 'Axle-line load', ax, 'kN', 1); S.r('OT', 'Off-tracking', OT, 'm', 2);
    S.w('AUTH', 'Abnormal load permit (JKR / JPJ / police escort) and route survey required.');
    S.n(`Axle-line load ${f0(ax)} kN vs crossing rating ${I.rate} kN; off-tracking ${f1(OT)} m at R = ${I.R} m.`);
  }});

defCalc({id:'CRN', no:'CS-RD-005', title:'Crane Access & Hardstanding', module:'m25', req:[],
  purpose:'Size granular crane working platform for the heaviest outrigger load.',
  codes:['BRE470','FMA','BOWEC'],
  assume:['Load spread through platform at angle α from the outrigger mat (screening); BRE 470 method recommended for design.'],
  criteria:['Pressure at formation ≤ allowable subgrade bearing; mat pressure ≤ platform capacity'],
  inputs:[
    {k:'F', sym:'F', l:'Max outrigger load (with dynamic factor)', u:'kN', d:1150, c:'Vendor Certified', s:'Crane lift plan'},
    {k:'Bm', sym:'B_m', l:'Outrigger mat size (square)', u:'m', d:2.0, c:'Contractor Provided'},
    {k:'qp', sym:'q_pl', l:'Allowable pressure on platform surface', u:'kPa', d:400, c:'Consultant Assumption'},
    {k:'qs', sym:'q_sub', l:'Allowable subgrade bearing', u:'kPa', d:100, c:'Consultant Assumption', s:'SI REQUIRED'},
    {k:'a', sym:'α', l:'Load spread angle from vertical', u:'°', d:30, c:'Consultant Assumption'},
    {k:'Ah', sym:'A_h', l:'Hardstanding area', u:'m²', d:900, c:'Estimated', s:'30 × 30 m at substation'},
  ],
  run(I, S){
    const qm = S.v('q_m', 'Mat pressure', 'q = F/B_m²', `${I.F}/${I.Bm}²`, I.F / I.Bm**2, 'kPa', '', 1);
    S.chk({label:'Mat pressure ≤ platform capacity', val: qm, lim: I.qp, rel:'<=', unit:'kPa', dp:0, fix:'Larger mats.'});
    const ta = Math.tan(rad(I.a));
    const t = bisect(t => I.F / (I.Bm + 2 * t * ta)**2 - I.qs, 0, 5) || 5;
    const tr = S.v('t', 'Required platform thickness', 'solve F/(B_m + 2t tanα)² = q_sub', 'bisection', Math.ceil(t * 20) / 20, 'm', 'Load spread (screening)', 2);
    S.r('t', 'Platform thickness', tr, 'm', 2);
    S.q('RD_HARD', I.Ah * tr, `${I.Ah} m² × ${f2(tr)} m`);
    S.w('DETAIL', 'Working platform to be designed by BRE 470 method and certified before crane use (BOWEC).');
    S.n(`Granular platform ${f2(tr)} m thick required over ${I.qs} kPa subgrade for ${I.F} kN outrigger load.`);
  }});

   CTR — cable trench
   ====================================================================== */
defCalc({id:'CTR', no:'CS-CT-001', title:'Cable Trench — Geometry & Quantities', module:'m34', req:[37],
  purpose:'Check trench width/cover for cable arrangement and compute excavation, sand, backfill, protection and tape quantities.',
  codes:['TNB_TG','CLIENT_ER'],
  assume:['Cables laid flat in one layer; sand bed below and sand surround above cables.','Cable cover requirements per TNB / client — VERIFY.'],
  criteria:['Required width ≤ trench width; cover to cable ≥ minimum'],
  inputs:[
    {g:'MV (33 kV) trench'},
    {k:'Lm', sym:'L_MV', l:'Length', u:'m', d:14500, c:'Estimated'},
    {k:'wm', sym:'w_MV', l:'Width', u:'m', d:0.8, c:'Consultant Assumption'},
    {k:'dm', sym:'d_MV', l:'Depth', u:'m', d:1.2, c:'Consultant Assumption'},
    {k:'nm', sym:'n_MV', l:'Number of cables', u:'no.', d:3, c:'Client Provided'},
    {k:'Dm', sym:'Ø_MV', l:'Cable diameter', u:'mm', d:95, c:'Vendor Certified'},
    {k:'sm', sym:'s_MV', l:'Spacing between cables', u:'mm', d:95, c:'Client Provided'},
    {k:'cm', sym:'c_MV', l:'Minimum cover to cable', u:'m', d:0.9, c:'Consultant Assumption', s:'TNB / client — VERIFY'},
    {g:'LV / DC trench'},
    {k:'Ll', sym:'L_LV', l:'Length', u:'m', d:21000, c:'Estimated'},
    {k:'wl', sym:'w_LV', l:'Width', u:'m', d:0.5, c:'Consultant Assumption'},
    {k:'dl', sym:'d_LV', l:'Depth', u:'m', d:0.8, c:'Consultant Assumption'},
    {k:'nl', sym:'n_LV', l:'Number of cables', u:'no.', d:4, c:'Client Provided'},
    {k:'Dl', sym:'Ø_LV', l:'Cable diameter', u:'mm', d:45, c:'Vendor Certified'},
    {k:'sl', sym:'s_LV', l:'Spacing', u:'mm', d:45, c:'Client Provided'},
    {k:'cl', sym:'c_LV', l:'Minimum cover', u:'m', d:0.6, c:'Consultant Assumption'},
    {g:'Common'},
    {k:'bed', sym:'t_bed', l:'Sand bed below cables', u:'m', d:0.1, c:'Client Provided'},
    {k:'sur', sym:'t_sur', l:'Sand cover above cables', u:'m', d:0.15, c:'Client Provided'},
    {k:'ec', sym:'e', l:'Edge clearance each side', u:'mm', d:75, c:'Consultant Assumption'},
  ],
  run(I, S){
    const one = (tag, L, w, d, n, D, s, cmin) => {
      S.h(tag + ' trench');
      const wr = S.v('w_req', 'Required width', 'n·Ø + (n−1)s + 2e', `${n}×${D} + ${n-1}×${s} + 2×${I.ec}`, (n * D + (n - 1) * s + 2 * I.ec) / 1000, 'm', '', 3);
      S.chk({label: tag + ' trench width', val: w, lim: wr, rel:'>=', unit:'m', dp:3, kind:'cap', what: tag + ' trench width', dem:'required width'});
      const cov = S.v('c', 'Cover to top of cable', 'c = d − t_bed − Ø', `${d} − ${I.bed} − ${D/1000}`, d - I.bed - D / 1000, 'm', '', 3);
      S.chk({label: tag + ' cover to cable', val: cov, lim: cmin, rel:'>=', unit:'m', dp:2, fix:'Deepen trench / add protection slabs.'});
      const Ve = S.v('V_e', 'Excavation', 'w·d·L', `${w}×${d}×${L}`, w * d * L, 'm³', '', 0);
      const Vcab = n * Math.PI * (D / 2000)**2 * L;
      const Vs = S.v('V_s', 'Sand', 'w(t_bed + Ø + t_sur)L − V_cables', `${w}(${I.bed} + ${D/1000} + ${I.sur})${L} − ${f0(Vcab)}`, w * (I.bed + D / 1000 + I.sur) * L - Vcab, 'm³', '', 0);
      const Vb = S.v('V_b', 'Backfill', 'V_e − V_s − V_cables', '', Ve - Vs - Vcab, 'm³', '', 0);
      return {Ve, Vs, Vb};
    };
    const a = one('MV', I.Lm, I.wm, I.dm, I.nm, I.Dm, I.sm, I.cm), b = one('LV/DC', I.Ll, I.wl, I.dl, I.nl, I.Dl, I.sl, I.cl);
    S.r('Vexc', 'Total excavation', a.Ve + b.Ve, 'm³', 0); S.r('Vsand', 'Total sand', a.Vs + b.Vs, 'm³', 0); S.r('L', 'Total trench length', I.Lm + I.Ll, 'm', 0);
    S.q('CT_EXC', a.Ve + b.Ve); S.q('CT_SAND', a.Vs + b.Vs); S.q('CT_BACK', a.Vb + b.Vb); S.q('CT_SLAB', I.Lm, 'MV protection'); S.q('CT_TAPE', I.Lm * 2 + I.Ll);
    S.p(`MV trench ${I.wm} × ${I.dm} m (${I.Lm} m); LV/DC trench ${I.wl} × ${I.dl} m (${I.Ll} m).`);
  }});

defCalc({id:'UGS', no:'CS-CT-002', title:'Underground Services — Road & Drain Crossings', module:'m35', req:[],
  purpose:'Quantify ducted crossings (roads/drains) and concrete encasement; check cover under roads.',
  codes:['TNB_TG','JKR_SPJ'],

    {k:'OD', sym:'OD', l:'Duct OD', u:'mm', d:160, c:'Vendor Certified'},

    const Vc = S.v('V_c', 'Encasement concrete', 'A_e·L_x·n_x', `${fmt(Ae,4)}×${I.Lx}×${I.nx}`, Ae * I.Lx * I.nx, 'm³', '', 1);

defCalc({id:'RTW', no:'CS-RW-001', title:'Retaining Wall — RC Cantilever', module:'m36', req:[38],
  purpose:'Stability and structural design of RC cantilever retaining wall at raised platform edges.',
  codes:['EN1997','EN1992','JKR_SLOPE'],
  assume:['Rankine active pressure, vertical back; wall friction neglected.','Stability FS: sliding 1.5, overturning 2.0 (consultant) — EC7 GEO/EQU may be adopted.','Structural ULS: 1.35 on earth & water pressure, 1.5 on surcharge.'],
  criteria:['FS_s ≥ 1.5 ; FS_o ≥ 2.0 ; e ≤ B/6 ; q_max ≤ q_all'],
  inputs:[
    {k:'H', sym:'H', l:'Retained height (to underside of base)', u:'m', d:2.5, c:'Estimated'},
    {k:'ts', sym:'t_s', l:'Stem thickness', u:'m', d:0.30, c:'Consultant Assumption'},
    {k:'B', sym:'B', l:'Base width', u:'m', d:2.6, c:'Consultant Assumption'},
    {k:'tt', sym:'b_t', l:'Toe length', u:'m', d:0.6, c:'Consultant Assumption'},
    {k:'tb', sym:'t_b', l:'Base thickness', u:'m', d:0.35, c:'Consultant Assumption'},
    {k:'g', sym:'γ', l:'Backfill unit weight', u:'kN/m³', d:19, c:'Consultant Assumption'},
    {k:'phi', sym:'φ′', l:'Backfill friction angle', u:'°', d:30, c:'Consultant Assumption'},
    {k:'q', sym:'q', l:'Surcharge', u:'kPa', d:10, c:'Consultant Assumption'},
    {k:'hw', sym:'h_w', l:'Water height behind wall', u:'m', d:0.5, c:'Consultant Assumption'},
    {k:'mu', sym:'μ', l:'Base friction', u:'', d:0.45, c:'Consultant Assumption'},
    {k:'qa', sym:'q_all', l:'Allowable bearing', u:'kPa', d:150, link:'BRG.qa'},
    {k:'fck', sym:'f_ck', l:'Concrete', u:'MPa', d:30, c:'Consultant Assumption'},
    {k:'Lw', sym:'L_w', l:'Wall length', u:'m', d:180, c:'Estimated'},
  ],
  run(I, S){
    const ka = S.v('K_a', 'Active coefficient', 'K_a = (1 − sinφ′)/(1 + sinφ′)', `(1 − sin${I.phi})/(1 + sin${I.phi})`, Ka(I.phi), '', 'Rankine', 3);
    const gp = I.g - 9.81, hd = I.H - I.hw;
    const Ps = S.v('P_s', 'Soil thrust', 'P_s = ½K_aγh_d² + K_aγh_d h_w + ½K_aγ′h_w²', '', 0.5 * ka * I.g * hd * hd + ka * I.g * hd * I.hw + 0.5 * ka * gp * I.hw**2, 'kN/m', '', 2);
    const Pw = S.v('P_w', 'Water thrust', '½γ_w h_w²', `0.5×9.81×${I.hw}²`, 0.5 * 9.81 * I.hw**2, 'kN/m', '', 2);
    const Pq = S.v('P_q', 'Surcharge thrust', 'K_a q H', `${f3(ka)}×${I.q}×${I.H}`, ka * I.q * I.H, 'kN/m', '', 2);
    const Mo = S.v('M_O', 'Overturning moment (about toe)', 'P_s·H/3 + P_w·h_w/3 + P_q·H/2', '', Ps * I.H / 3 + Pw * I.hw / 3 + Pq * I.H / 2, 'kN·m/m', '', 2);
    const heel = I.B - I.tt - I.ts, Hs = I.H - I.tb;
    const W1 = 24 * I.ts * Hs, W2 = 24 * I.B * I.tb, W3 = I.g * heel * Hs;
    const V = S.v('ΣV', 'Vertical load', 'W_stem + W_base + W_soil,heel', `${f1(W1)} + ${f1(W2)} + ${f1(W3)}`, W1 + W2 + W3, 'kN/m', '', 1);
    const Mr = S.v('M_R', 'Restoring moment', 'ΣW·x', '', W1 * (I.tt + I.ts / 2) + W2 * I.B / 2 + W3 * (I.B - heel / 2), 'kN·m/m', '', 1);
    S.chk({label:'Overturning FS', val: Mr / Mo, lim: 2.0, rel:'>=', dp:2, fix:'Increase base width (heel).'});
    S.chk({label:'Sliding FS', val: I.mu * V / (Ps + Pw + Pq), lim: 1.5, rel:'>=', dp:2, fix:'Add shear key / widen base.'});
    const xr = (Mr - Mo) / V, e = S.v('e', 'Eccentricity', 'e = B/2 − (M_R − M_O)/ΣV', `${I.B}/2 − ${f2(xr)}`, I.B / 2 - xr, 'm', '', 3);
    const qmax = S.v('q_max', 'Max bearing', 'ΣV/B(1 + 6e/B)', '', e <= I.B / 6 ? V / I.B * (1 + 6 * e / I.B) : 2 * V / (3 * Math.max(xr, 0.05)), 'kPa', '', 1);
    S.chk({label:'Eccentricity ≤ B/6', val: e, lim: I.B / 6, rel:'<=', unit:'m', dp:3});
    S.chk({label:'Bearing', val: qmax, lim: I.qa, rel:'<=', unit:'kPa', dp:1});
    S.h('Stem design (ULS)');
    const Ms = S.v('M_stem', 'Stem moment at base', '1.35(K_aγHs³/6 + γ_w h_w³/6) + 1.5K_a q Hs²/2', '', 1.35 * (ka * I.g * Hs**3 / 6 + 9.81 * Math.min(I.hw, Hs)**3 / 6) + 1.5 * ka * I.q * Hs**2 / 2, 'kN·m/m', '', 2);
    const rc = rcFlex(S, {M: Ms, b: 1000, h: I.ts * 1000, c: 50, bar: 16, fck: I.fck, fyk: 500, tag: 'stem'});
    const Mh = S.v('M_heel', 'Heel moment (ULS, conservative)', '1.35 W_soil,heel·heel/2', `1.35×${f1(W3)}×${f2(heel)}/2`, 1.35 * W3 * heel / 2, 'kN·m/m', '', 2);
    const rh = rcFlex(S, {M: Mh, b: 1000, h: I.tb * 1000, c: 50, bar: 16, fck: I.fck, fyk: 500, tag: 'heel'});
    const Vc = (I.ts * Hs + I.B * I.tb) * I.Lw;
    S.q('CN_G30', Vc, `${I.Lw} m wall`); S.q('RF_Y', ((rc.Aprov + rh.Aprov) * 1e-6 * (Hs + I.B) * 1.8) * 7.85 * I.Lw * 1.1, 'Stem + base, both faces'); S.q('FW_FORM', 2 * Hs * I.Lw + 2 * I.tb * I.Lw); S.q('EX_FDN', I.B * 1.0 * I.Lw);
    S.r('FSo', 'Overturning FS', Mr / Mo, '', 2); S.r('FSs', 'Sliding FS', I.mu * V / (Ps + Pw + Pq), '', 2); S.r('qmax', 'Max bearing', qmax, 'kPa', 1);
    S.p(`RC cantilever wall H = ${I.H} m, base ${I.B} m, stem ${I.ts * 1000} mm with T16@${rc.s}; ${I.Lw} m length.`);
  }});

/* ======================================================================
   FEN — fence foundation
   ====================================================================== */
defCalc({id:'FEN', no:'CS-ANC-001', title:'Fence Post & Foundation', module:'m37', req:[39],
  purpose:'Check perimeter fence post bending and footing lateral capacity under wind.',
  codes:['EN1991_4','EN1993','LIT_BROMS'],
  assume:['Wind on fence area with effective solidity (mesh + debris allowance).','Footing as rigid short pile (Broms) in cohesionless soil.'],
  criteria:['Post σ ≤ f_y/γ_M0 ; H_u/F ≥ FS'],
  inputs:[
    {k:'h', sym:'h', l:'Fence height', u:'m', d:2.4, link:'WND.zf'},
    {k:'qp', sym:'q_p', l:'Peak pressure', u:'kPa', d:0.5, link:'WND.qp_fence'},
    {k:'cf', sym:'c_f', l:'Force coefficient', u:'', d:1.2, c:'Consultant Assumption'},
    {k:'sol', sym:'φ_s', l:'Effective solidity', u:'', d:0.3, c:'Consultant Assumption', s:'Chain-link incl. debris allowance'},
    {k:'s', sym:'s', l:'Post spacing', u:'m', d:3.0, c:'Client Provided'},
    {k:'OD', sym:'OD', l:'Post CHS OD', u:'mm', d:76.1, c:'Vendor Certified'},
    {k:'t', sym:'t', l:'Post wall thickness', u:'mm', d:3.2, c:'Vendor Certified'},
    {k:'fy', sym:'f_y', l:'Yield', u:'MPa', d:275, c:'Vendor Certified'},
    {k:'d', sym:'d', l:'Footing diameter', u:'m', d:0.3, c:'Consultant Assumption'},
    {k:'L', sym:'L', l:'Footing depth', u:'m', d:0.9, c:'Consultant Assumption'},
    {k:'phi', sym:'φ′', l:'Soil φ′', u:'°', d:28, link:'GEO.fdn_phi'},
    {k:'g', sym:'γ', l:'Soil γ', u:'kN/m³', d:18, link:'GEO.fdn_g'},
    {k:'cu', sym:'C_u', l:'Soil C_u (cohesive founding layer)', u:'kPa', d:0, link:'GEO.fdn_cu'},
    {k:'FS', sym:'FS', l:'Lateral FS', u:'', d:2.0, c:'Consultant Assumption'},
    {k:'Lf', sym:'L_f', l:'Fence length', u:'m', d:6250, link:'LAND.perim'},
  ],
  run(I, S, P, R){
    const F = S.v('F', 'Wind force per post', 'F = q_p c_f φ_s h s', `${f3(I.qp)}×${I.cf}×${I.sol}×${I.h}×${I.s}`, I.qp * I.cf * I.sol * I.h * I.s, 'kN', 'EN1991_4', 3);
    const M = S.v('M', 'Moment at ground', 'M = F h/2', `${f3(F)}×${I.h}/2`, F * I.h / 2, 'kN·m', '', 3);
    const Z = Math.PI * (I.OD**4 - (I.OD - 2 * I.t)**4) / (32 * I.OD);
    const sg = S.v('σ', 'Post bending stress', 'σ = 1.5M/Z (ULS)', `1.5×${f3(M)}×10⁶/${f0(Z)}`, 1.5 * M * 1e6 / Z, 'MPa', 'EN1993', 1);
    S.chk({label:'Post bending', val: sg, lim: I.fy, rel:'<=', unit:'MPa', dp:0, fix:'Larger post section.'});
    const phi = Math.max(I.phi, 20), e = I.h / 2, coh = I.cu > 0 && (R.GEO && R.GEO.res.fdn_type_clay);
    const HuF = L => coh ? bromsLateral({type:'coh', cu:I.cu, D:I.d, L, e, My:1e6}).Hs : 0.5 * I.g * I.d * L**3 * Kp(phi) / (e + L);
    const Hu = S.v('H_u', 'Footing lateral capacity (Broms short, ' + (coh ? 'cohesive' : 'cohesionless') + ')', coh ? 'solve H(e + 1.5d + 0.5f) = 2.25C_u d g², f = H/(9C_u d)' : 'H_u = ½γdL³K_p/(e + L)', coh ? `C_u = ${f0(I.cu)} kPa, d = ${I.d} m, L = ${I.L} m` : `0.5×${I.g}×${I.d}×${I.L}³×${f2(Kp(phi))}/(${e} + ${I.L})`, HuF(I.L), 'kN', 'LIT_BROMS', 3);
    S.chk({label:'Footing lateral FS', val: Hu / F, lim: I.FS, rel:'>=', dp:2, fix:'Increase footing depth / diameter.'});
    const Lreq = bisect(L => HuF(L) - I.FS * F, 0.3, 5);
    if (Lreq) S.v('L_req', 'Required depth (auto-size)', 'solve H_u(L) = FS·F', 'bisection', Math.ceil(Lreq * 20) / 20, 'm', '', 2);
    S.r('F', 'Wind per post', F, 'kN', 3); S.r('FSl', 'Lateral FS', Hu / F, '', 2); S.r('Lreq', 'Required footing depth', Lreq ? Math.ceil(Lreq * 20) / 20 : null, 'm', 2);
    const np = Math.ceil(I.Lf / I.s) + 1;
    S.q('FN_FENCE', I.Lf, 'Perimeter'); S.q('CN_G30', np * Math.PI * I.d**2 / 4 * I.L, `${np} footings`);
    S.p(`CHS ${I.OD}×${I.t} posts @ ${I.s} m in Ø${I.d * 1000} mm × ${I.L} m concrete footings; ${f0(I.Lf)} m fence.`);
  }});

defCalc({id:'GAT', no:'CS-ANC-002', title:'Gate Post Foundation', module:'m38', req:[],
  purpose:'Check gate post pad foundation for leaf self-weight eccentricity and wind.',
  codes:['EN1991_4','EN1997'],
  assume:['Leaf cantilevered from post; wind on leaf with solidity.'],

    {k:'h', sym:'h', l:'Leaf height', u:'m', d:2.4, c:'Client Provided'},

    {k:'sol', sym:'φ_s', l:'Solidity', u:'', d:0.5, c:'Consultant Assumption'},

    {k:'D', sym:'D', l:'Pad depth', u:'m', d:1.2, c:'Consultant Assumption'},

  ],
  run(I, S){

    const M = S.v('M', 'Overturning at base', 'F_w(h/2 + D) + W_l w/2', '', Fw * (I.h / 2 + I.D) + I.W * I.w / 2, 'kN·m', '', 2);
    const Wf = S.v('W_f', 'Pad weight', '24B²D', '', 24 * I.B**2 * I.D, 'kN', '', 1);

    S.r('M', 'Overturning moment', M, 'kN·m', 2); S.r('q', 'Bearing pressure', q, 'kPa', 1);
    S.q('FN_GATE', I.n);
    S.p(`Gate post pad ${I.B} × ${I.B} × ${I.D} m; ${I.n} gates.`);
  }});

defCalc({id:'BPL', no:'CS-BES-001', title:'BESS Platform', module:'m43', types:['B'], req:[41],
  purpose:'Determine BESS platform footprint, level, fill, drainage fall and containment requirement.',
  codes:['BOMBA_BESS','NFPA855','FM533','MSMA2'],
  assume:['Container spacing and aisles per BOMBA / vendor / NFPA 855 guidance — VERIFY.'],
  criteria:['Footprint ≤ allocated compound; platform RL ≥ flood RL; crossfall ≥ 1%'],
  inputs:[
    {k:'n', sym:'n_c', l:'Number of BESS enclosures', u:'no.', d:()=>Math.ceil((+P.info.bessMWh||200)/5.0), c:'Vendor Certified'},
    {k:'Lc', sym:'L_c', l:'Enclosure length', u:'m', d:12.2, c:'Vendor Certified'},
    {k:'Wc', sym:'W_c', l:'Enclosure width', u:'m', d:2.6, c:'Vendor Certified'},
    {k:'sx', sym:'s_x', l:'Side spacing between enclosures', u:'m', d:3.0, c:'Consultant Assumption', s:'BOMBA / vendor — VERIFY'},
    {k:'sy', sym:'s_y', l:'End spacing / aisle', u:'m', d:6.0, c:'Consultant Assumption'},
    {k:'npcs', sym:'n_PCS', l:'PCS / MV skids', u:'no.', d:()=>Math.ceil((+P.info.bessMW||50)/4.0), c:'Vendor Certified'},
    {k:'pw', sym:'w_r', l:'Perimeter road width', u:'m', d:6.0, c:'Consultant Assumption'},
    {k:'rl', sym:'RL', l:'Platform RL (design)', u:'m RL', d:0, link:'CF.rl_PF-BESS'},
    {k:'egl', sym:'EGL', l:'Existing ground (avg)', u:'m RL', d:0, link:'FPL.egl_BESS'},
    {k:'cf', sym:'i', l:'Platform crossfall', u:'%', d:1.0, c:'Consultant Assumption'},
  ],
  run(I, S){
    const cols = Math.ceil(Math.sqrt(I.n / 2)) * 2, rows = Math.ceil(I.n / cols);
    const W = S.v('W', 'Array width', 'cols(W_c + s_x) + 2w_r', `${cols}(${I.Wc} + ${I.sx}) + 2×${I.pw}`, cols * (I.Wc + I.sx) + 2 * I.pw, 'm', '', 1);
    const L = S.v('L', 'Array length', 'rows(L_c + s_y) + PCS row + 2w_r', `${rows}(${I.Lc} + ${I.sy}) + 8 + 2×${I.pw}`, rows * (I.Lc + I.sy) + 8 + 2 * I.pw, 'm', '', 1);
    const A = S.v('A', 'Platform footprint', 'W·L', '', W * L, 'm²', '', 0);
    const pl = platforms().find(p => p.id === 'PF-BESS'), D = getDEM(); const Aal = pl ? pl.w * pl.h * D.dx * D.dx : A;
    S.chk({label:'Footprint within allocated BESS compound', val: A, lim: Aal, rel:'<=', unit:'m²', dp:0, fix:'Enlarge compound or reduce spacing (subject to BOMBA).'});
    const dh = S.v('Δh', 'Level difference across platform', 'i·W/100', `${I.cf}×${f1(W)}/100`, I.cf * W / 100, 'm', '', 2);
    const Vf = S.v('V_f', 'Platform fill (indicative)', 'A·max(0, RL − EGL + Δh/2)', '', A * Math.max(0, I.rl - I.egl + dh / 2), 'm³', 'Included in CS-EW-001', 0);
    S.r('area', 'Platform area', A, 'm²', 0); S.r('perim', 'Platform perimeter', 2 * (W + L), 'm', 0); S.r('W', 'Width', W, 'm', 1); S.r('L', 'Length', L, 'm', 1); S.r('rl', 'Platform RL', I.rl, 'm RL', 2);
    S.q('BS_GRAVEL', A); S.q('BS_KERB', 2 * (W + L));
    S.n(`BESS platform ${f0(W)} × ${f0(L)} m (${f2(A / 1e4)} ha) at RL ${f2(I.rl)} m; containment required for transformer oil, coolant and fire-water (see CS-BES-004).`);
    S.w('AUTH', 'BESS separation distances and fire access to be confirmed with BOMBA and client insurer.');
  }});

    const calcs = [...new Set(it.src.filter(s => s.calc).map(s => CALCS[s.calc].no))];
    const confs = it.src.filter(s => s.calc).map(s => calcConfidence(s.calc));
    const conf = !confs.length ? 'Medium' : confs.includes('Low') ? 'Low' : confs.includes('Medium') ? 'Medium' : 'High';
    return {key: it.key, bill: lib.bill, desc: lib.desc, unit: lib.unit, qty: it.qty, rate, amount: it.qty * rate, calcs: calcs.join(', ') || '—', dwg: BILL_DWG[lib.bill.split(' ')[0]] || '—', basis: it.src.map(s => s.basis).filter(Boolean).join('; '), conf, grp: lib.grp, remarks: (P.boqRemarks || {})[it.key] || ''};
  }).sort((a, b) => { const ba = parseInt(a.bill), bb = parseInt(b.bill); return ba - bb || BOQ_ROWS.findIndex(r => r[0] === a.key) - BOQ_ROWS.findIndex(r => r[0] === b.key); });
}
function costSummary(rows){
  rows = rows || boqRows(); const bills = {};
  rows.forEach(r => bills[r.bill] = (bills[r.bill] || 0) + r.amount);
  const direct = sum(Object.values(bills)), cc = P.costCfg || {prelimPct:8, designPct:3, contPct:10};
  const prelim = direct * cc.prelimPct / 100, design = direct * cc.designPct / 100, cont = (direct + prelim + design) * cc.contPct / 100;
  return {bills, direct, prelim, design, cont, total: direct + prelim + design + cont};
}
function sensitivityTornado(pct){
  const save = clone(P.rateMult || {}); const base = costSummary(boqRows()).total; const out = [];
  Object.keys(SENS_GROUPS).forEach(g => { P.rateMult = Object.assign({}, save, {[g]: (save[g] || 0) + pct}); const hi = costSummary(boqRows()).total; P.rateMult = Object.assign({}, save, {[g]: (save[g] || 0) - pct}); const lo = costSummary(boqRows()).total; out.push({g, label: SENS_GROUPS[g], lo: lo - base, hi: hi - base}); });
  P.rateMult = save; return {base, out};
}

/* ======================================================================
   TENDER RECONCILIATION & SCOPE GAP
   ====================================================================== */
const TENDER = {rows: [], gaps: [], issues: []};
function buildTender(){
  const req = {}; boqRows().forEach(r => req[r.key] = r);
  const tk = {}; (P.tender || []).forEach(t => { const x = tk[t.key] = tk[t.key] || {lines:[], qty:0, amt:0, flags:new Set(), scope:[]}; x.lines.push(t); x.qty += +t.qty || 0; x.amt += (+t.qty || 0) * (+t.rate || 0); if (t.flag) x.flags.add(t.flag); if (t.scope) x.scope.push(t.scope); });
  const keys = [...new Set([...Object.keys(req), ...Object.keys(tk)])];
  TENDER.rows = keys.map(k => { const r = req[k], t = tk[k], lib = BOQ_LIB[k] || {desc:k, unit:''};
    const rq = r ? r.qty : 0, tq = t ? t.qty : 0, diff = tq - rq, trate = t && t.qty ? t.amt / t.qty : 0, erate = rateOf(k);
    const issues = [];
    if (rq > 0 && (!t || tq === 0)) issues.push(t && t.flags.has('Excluded') ? 'Scope exclusion' : 'Omitted item');
    if (t && t.flags.has('Excluded') && !issues.includes('Scope exclusion')) issues.push('Scope exclusion');
    if (rq > 0 && tq > 0 && diff / rq < -0.10) issues.push('Under-quantity');
    if (rq > 0 && tq > 0 && diff / rq > 0.10) issues.push('Over-quantity');
    if (!r && t && tq > 0) issues.push('Not required by engineering');
    if (t && (t.flags.has('TBC') || t.scope.some(s => /TBC|TBA|to be confirmed/i.test(s)))) issues.push('Unclear specification');
    if (t && t.flags.has('Provisional')) issues.push('Provisional item');
    if (t && t.lines.length > 1) issues.push('Duplication');
    const reqAmt = rq * erate, tAmt = t ? t.amt : 0;
    return {key:k, desc: lib.desc, unit: lib.unit, rq, tq, diff, rscope: r ? (r.calcs !== '—' ? 'Req. by ' + r.calcs : 'Required') : '—', tscope: t ? t.scope.join('; ') : '—', erate, trate, reqAmt, tAmt, variance: tAmt - reqAmt, issues};
  }).sort((a, b) => (BOQ_ROWS.findIndex(r => r[0] === a.key)) - (BOQ_ROWS.findIndex(r => r[0] === b.key)));
  TENDER.gaps = SCOPE_AREAS.filter(s => !s[3] || s[3] === P.type).map(([id, name, keys]) => { const reqd = keys.some(k => req[k]); const inT = keys.some(k => tk[k] && tk[k].qty > 0 && !tk[k].flags.has('Excluded')); return {id, name, keys, required: reqd, priced: inT, gap: reqd && !inT, partial: reqd && inT && keys.some(k => req[k] && !(tk[k] && tk[k].qty > 0))}; }).filter(g => g.gap || g.partial);
  TENDER.issues = TENDER.rows.filter(r => r.issues.length);
  TENDER.totReq = sum(TENDER.rows.map(r => r.reqAmt)); TENDER.totT = sum(TENDER.rows.map(r => r.tAmt));
}

/* ======================================================================
   RISK ENGINE
   ====================================================================== */
let RISKS = [];
function buildRisks(){
  RISKS = [];
  RISK_LIB.forEach(t => { if (t.types && !t.types.includes(P.type)) return; let on = false; try { on = !!t.cond(R, P); } catch(e){ on = false; }
    if (on) RISKS.push({id:t.id, mod:t.mod, title:t.t, chain:t.chain, L:t.L, C:t.C, mit:t.mit, owner:t.owner, auto:true, status:(P.review['risk_' + t.id] || 'Open')}); });
  (P.reg.risks || []).forEach((r, i) => RISKS.push(Object.assign({auto:false, idx:i}, r, {L:+r.L||1, C:+r.C||1, chain:[r.issue, r.cons, r.cost, r.prog]})));
  RISKS.forEach(r => { r.score = r.L * r.C; r.level = r.score >= 15 ? 'High' : r.score >= 8 ? 'Medium' : 'Low'; });
  RISKS.sort((a, b) => b.score - a.score);
}

   aggregations for registers / missing information
   ====================================================================== */
function allWarnings(){
  const out = []; Object.keys(R).forEach(id => (R[id].warns || []).forEach(w => out.push(Object.assign({calc:id}, w)))); return out;
}
function autoAssumptions(){
  const out = [];
  Object.keys(R).forEach(id => { const c = CALCS[id], r = R[id];
    c.assume.forEach(a => out.push({src: c.no, text: a, type: 'Method'}));
    c.inputs.forEach(d => { if (!d.k) return; const m = r.meta && r.meta[d.k]; if (m && m.linked) return; const cf = inputConf(id, d, false);
      if (['Consultant Assumption','Estimated','Unknown'].includes(cf)) out.push({src: c.no, text: `${d.l}${d.sym ? ' (' + d.sym + ')' : ''} = ${typeof r.I[d.k] === 'number' ? fmt(r.I[d.k]) : r.I[d.k]} ${d.u || ''}${inputSrc(id, d) ? ' — ' + inputSrc(id, d) : ''}`, type: cf}); }); });
  return out;
}
function autoClarifications(){
  const out = []; let n = 1;
  TENDER.gaps.forEach(g => out.push({id:'TC-' + String(n++).padStart(3, '0'), ref: g.name, q: `Tender does not ${g.gap ? 'include' : 'fully include'} ${g.name.toLowerCase()} scope (${g.keys.join(', ')}). Bidder to confirm inclusion and price.`, cat:'Scope gap'}));
  TENDER.issues.forEach(r => r.issues.forEach(i => { if (i === 'Not required by engineering') return;
    const txt = {'Omitted item':`Item "${r.desc}" required (${fmt(r.rq,0)} ${r.unit}) is not priced. Confirm inclusion.`, 'Scope exclusion':`"${r.desc}" is excluded. Confirm basis of exclusion and interface responsibility.`, 'Under-quantity':`Tender quantity for "${r.desc}" (${fmt(r.tq,0)} ${r.unit}) is ${fmt(-r.diff / r.rq * 100, 0)}% below engineering estimate (${fmt(r.rq,0)}). Confirm measurement basis.`, 'Over-quantity':`Tender quantity for "${r.desc}" exceeds engineering estimate by ${fmt(r.diff / r.rq * 100, 0)}%. Provide measurement basis.`, 'Unclear specification':`Specification for "${r.desc}" unclear (${r.tscope}). Confirm size / specification.`, 'Provisional item':`"${r.desc}" priced as provisional. Confirm re-measurement basis and rate validity.`, 'Duplication':`"${r.desc}" appears in more than one line. Confirm no double counting.`}[i];
    if (txt) out.push({id:'TC-' + String(n++).padStart(3, '0'), ref: r.key, q: txt, cat: i}); }));
  return out;
}
function missingInfo(){
  const tags = {}; allWarnings().forEach(w => { if (['SI','TOPO','JPS','VENDOR','AUTH'].includes(w.tag)){ (tags[w.tag] = tags[w.tag] || []).push(w); } });
  const docs = (P.docs || []).filter(d => d.status !== 'Received');
  return {tags, docs};
}
function moduleStatus(m){
  const cs = (m.calcs || []).filter(calcApplies); if (!cs.length) return '';
  const st = cs.map(c => R[c] && R[c].status); return st.includes('fail') ? 'fail' : st.includes('pass') ? 'pass' : 'warn';
}
function afterRun(){ buildQTO(); buildTender(); buildRisks(); }

/* sample contractor quotation derived from engineering quantities with deliberate deviations (DEMONSTRATION) */
function genSampleTender(){
  const rows = boqRows(); const out = []; let k = 0;
  const OMIT = ['EW_HAUL','PL_TEST_L','AS_BUILT','CT_TAPE','BS_OWS','DR_SPILL','ES_CHECK','SI_LAB','EW_TURF','RD_GEOTEX','CT_DUCT','TW_LAYDOWN'];
  const FACT = {EW_IMPORT:0.58, CN_G30:0.78, RF_Y:0.74, DR_POND_EXC:0.66, FN_FENCE:1.16, EW_STRIP:1.25, PL_TEST_T:0.5, RD_SUBBASE:0.86, DR_PIPE:0.75};
  rows.forEach(r => { k++;
    if (OMIT.includes(r.key)) return;
    const jit = 1 + (((k * 37) % 11) - 5) / 100, rj = 1 + (((k * 53) % 13) - 6) / 100;
    const q = r.qty * (FACT[r.key] || jit), rate = +(r.rate * rj).toFixed(2);
    const unitQ = ['no.','no','lot','month','t'].includes(r.unit) ? Math.max(1, Math.round(q)) : Math.round(q);
    if (r.key === 'AU_SUB'){ out.push({id:uid(), key:r.key, qty:0, rate:0, scope:'Authority submissions — EXCLUDED by contractor', flag:'Excluded'}); return; }
    if (r.key === 'EW_CUT'){ out.push({id:uid(), key:r.key, qty:Math.round(q*0.7), rate, scope:'Cut to fill (bulk)', flag:''}, {id:uid(), key:r.key, qty:Math.round(q*0.3), rate, scope:'Cut (platforms) — also included in bulk', flag:''}); return; }
    const flag = r.key === 'DR_CONC' ? 'TBC' : ['SI_BH','PL_PREDRILL'].includes(r.key) ? 'Provisional' : '';
    out.push({id:uid(), key:r.key, qty:unitQ, rate, scope: r.key === 'DR_CONC' ? 'Concrete drain — size TBC' : r.desc, flag});
  });
  return out;
}

/* generic editable table bound to P path */
function editTable(path, cols, opt){
  opt = opt || {}; const arr = getPath(P, path) || []; const perm = opt.perm || 'registers';
  let h = `<div class="tw"><table class="t"><thead><tr>${opt.idx ? '<th>#</th>' : ''}${cols.map(c => `<th class="${c.n ? 'n' : ''}" style="${c.w ? 'min-width:' + c.w + 'px' : ''}">${esc(c.l)}</th>`).join('')}${can(perm) && !opt.noDel ? '<th></th>' : ''}</tr></thead><tbody>`;
  arr.forEach((r, i) => {
    h += `<tr>${opt.idx ? `<td class="muted">${i + 1}</td>` : ''}` + cols.map(c => {
      const v = getPath(r, c.k); const bp = `${path}.${i}.${c.k}`;
      if (c.ro) return `<td class="${c.n ? 'n' : ''}">${c.fmt ? c.fmt(v, r, i) : esc(v)}</td>`;
      if (c.t === 'sel') return `<td><select data-bind="${bp}"${dis(perm)}>${(typeof c.o === 'function' ? c.o(r) : c.o).map(o => `<option${o == v ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select></td>`;
      if (c.t === 'area') return `<td><textarea data-bind="${bp}"${dis(perm)} rows="2">${esc(v)}</textarea></td>`;
      return `<td><input ${c.n ? 'class="num" data-num="1"' : ''} data-bind="${bp}" value="${esc(v == null ? '' : v)}"${dis(perm)}></td>`;
    }).join('') + (can(perm) && !opt.noDel ? `<td><button class="sm" data-act="delrow" data-path="${path}" data-i="${i}" title="Delete row">✕</button></td>` : '') + '</tr>';
  });
  h += '</tbody></table></div>';
  if (can(perm) && opt.tpl) h += `<div class="row" style="margin-top:6px"><button class="sm" data-act="addrow" data-path="${path}" data-tpl='${esc(JSON.stringify(opt.tpl))}'>+ Add row</button>${opt.extra || ''}</div>`;
  return h;
}
function getPath(o, path){ return path.split('.').reduce((a, k) => a == null ? undefined : a[k], o); }
function setPath(o, path, v){ const ks = path.split('.'); const last = ks.pop(); const t = ks.reduce((a, k) => a[k] = a[k] == null ? {} : a[k], o); t[last] = v; }

/* ---------- UTM (WGS84) ---------- */
function toUTM(lat, lon){

  const N = a / Math.sqrt(1 - e2 * Math.sin(p)**2), Tt = Math.tan(p)**2, C = ep2 * Math.cos(p)**2, A = Math.cos(p) * (l - l0);

  const E = k0 * N * (A + (1 - Tt + C) * A**3 / 6 + (5 - 18*Tt + Tt*Tt + 72*C - 58*ep2) * A**5 / 120) + 500000;
  let Nn = k0 * (M + N * Math.tan(p) * (A*A/2 + (5 - Tt + 9*C + 4*C*C) * A**4 / 24 + (61 - 58*Tt + Tt*Tt + 600*C - 330*ep2) * A**6 / 720)); if (lat < 0) Nn += 1e7;
  return {zone, E, N: Nn, epsg: (lat >= 0 ? 32600 : 32700) + zone};
}

function techChapter(title, mods, f){
  const ms = mods.map(id => MOD[id]).filter(m => m && modApplies(m)); const cs = [...new Set(ms.flatMap(m => (m.calcs || []).filter(calcApplies)))]; const rs = cs.map(c => R[c]).filter(Boolean);

  f.h2('Standards'); f.ul([...new Set(cs.flatMap(c => CALCS[c].codes))].map(id => stdTitle(id) + ' — ' + CVR));
  f.h2('Inputs'); if (cs.length) f.tbl(title + ' — key inputs', ['Calc','Parameter','Value','Unit','Confidence'], cs.flatMap(c => CALCS[c].inputs.filter(d => d.k && d.t !== 'x').slice(0, 9).map(d => { const m = R[c].meta[d.k] || {}; const v = R[c].I[d.k]; return [CALCS[c].no, `${d.l}${d.sym ? ' (' + d.sym + ')' : ''}`, isNum(v) ? fmt(v) : String(v), d.u || '', inputConf(c, d, m.linked)]; })), ['l','l','n','c','l']);
  if (ms.some(m => m.id === 'm10')) f.tbl('Borehole summary', ['BH','RL','Depth','GWL','pH','Resistivity'], (P.tables.bh || []).map(b => [b.id, f2(b.rl), f1(b.depth), f1(b.gwl), f1(b.ph), f0(b.res)]));
  f.h2('Assumptions'); f.ul(cs.flatMap(c => CALCS[c].assume));
  f.h2('Proposed Works'); f.ul(rs.flatMap(r => r.prop));
  f.h2('Calculation Method'); f.ul(cs.map(c => `${CALCS[c].no} ${CALCS[c].title}: ${CALCS[c].purpose}`));
  f.h2('Detailed Calculation'); rs.forEach((r, i) => { const eq = r.steps.filter(s => s.t === 'e' && s.val != null).slice(0, 10); if (eq.length) f.tbl(`${CALCS[cs[i]].no} — principal calculation steps (full sheet in appendix)`, ['Symbol','Description','Equation','Substitution','Result'], eq.map(s => [s.sym, s.desc || '', s.formula || '', s.subst || '', `${fmt(s.val, s.dp)} ${s.unit || ''}`]), ['l','l','l','l','n']); });
  ms.forEach(m => (FIGS[m.id] || []).forEach(([cap, fn]) => { try { f.fig(cap, fn()); } catch(e){} }));
  f.h2('Results'); if (rs.length) f.tbl(title + ' — results', ['Calc','Result','Value','Unit'], rs.flatMap((r, i) => r.resList.map(x => [CALCS[cs[i]].no, x.label, fmt(x.val, x.dp), x.unit || ''])), ['l','l','n','c']);
  f.h2('Compliance Check'); const ch = rs.flatMap((r, i) => r.checks.map(k => [CALCS[cs[i]].no, k.label, `${fmt(k.val, k.dp == null ? 2 : k.dp)} ${k.unit || ''}`, `${k.rel === '<=' ? '≤' : '≥'} ${fmt(k.lim, k.dp == null ? 2 : k.dp)}`, k.pass ? 'PASS' : 'FAIL']));
  if (ch.length) f.tbl(title + ' — engineering checks', ['Calc','Check','Value','Limit','Result'], ch, ['l','l','n','n','c']); else f.p('No numerical code checks in this chapter.');
  rs.forEach(r => r.checks.filter(k => !k.pass).forEach(k => f.p(k.msg)));
  f.h2('Sensitivity'); const sens = ms.flatMap(m => m.sens || []).filter(s => calcApplies(s.calc));
  if (sens.length) sens.forEach(s => { const ys = sensitivity(s.calc, s.key, s.vals, s.out.map(o => o[0])); f.fig(`Sensitivity — ${s.yl} vs ${s.xl}`, lineChart({xs: s.vals, series: s.out.map((o, j) => ({name:o[1], ys: ys.map(r => r[j])})), xl: s.xl, yl: s.yl, hl: s.hl ? s.hl(R) : null, legend: true})); });
  else f.p('Sensitivity not critical for this chapter at tender stage.');
  f.h2('Risk'); const rk = RISKS.filter(r => mods.includes(r.mod)); f.ul(rk.map(r => `${r.id} ${r.title}: ${r.chain.join(' → ')} (L${r.L} × C${r.C} = ${r.score}).`).concat(rs.flatMap(r => r.warns.map(w => `${WARN[w.tag]}: ${w.text}`))).slice(0, 14));
  f.h2('Quantity'); const qs = rs.flatMap((r, i) => r.qty.map(q => [BOQ_LIB[q.key].desc, BOQ_LIB[q.key].unit, fmt(q.qty, q.qty < 100 ? 2 : 0), CALCS[cs[i]].no])); if (qs.length) f.tbl(title + ' — quantities', ['Item','Unit','Quantity','Calc'], qs, ['l','c','n','l']); else f.p('No direct BOQ quantities.');
  f.h2('Tender Impact'); const keys = rs.flatMap(r => r.qty.map(q => q.key)); const ti = TENDER.rows.filter(r => keys.includes(r.key) && r.issues.length);
  f.ul([...rs.flatMap(r => r.tender), ...ti.map(r => `${r.desc}: ${r.issues.join(', ')} (required ${fmt(r.rq, 0)} ${r.unit}, tender ${fmt(r.tq, 0)} ${r.unit}).`)]);
  if (!ti.length && !rs.some(r => r.tender.length)) f.p('Tender quantities for this chapter are consistent with engineering requirements (±10%).');
  f.h2('Recommendation'); f.ul([...ms.flatMap(m => m.rec || []), ...rs.flatMap(r => r.checks.filter(k => !k.pass).map(k => k.fix || 'Revise design.'))]);
  f.h2('Conclusion'); const nf = rs.filter(r => r.status === 'fail').length;
  f.p(nf ? `${nf} of ${rs.length} calculations in this chapter show non-compliance that must be resolved before design freeze; the remaining calculations satisfy the adopted criteria at screening level.` : `All ${rs.length} calculation(s) in this chapter satisfy the adopted criteria at screening level, subject to the outstanding information and verification noted.`);
}

function calcSheetModel(cid){

   PAGES — custom input panels for technical modules and all non-calculation
   module pages (dashboard, registers, commercial, compliance, report)

const CUSTOM = {
  site(){
    let tot = 0, n = 0; SITE_ITEMS.forEach(s => { const r = (P.site[s[0]] || {}).rating; if (RATING_W[r]){ tot += RATING_W[r]; n++; } });
    const avg = n ? tot / n : 0, lvl = avg >= 2.4 ? 'HIGH' : avg >= 1.6 ? 'MODERATE' : 'LOW';
    let h = `<div class="card"><h3>Site constraint matrix <span class="badge ${lvl === 'HIGH' ? 'fail' : lvl === 'MODERATE' ? 'warn' : 'pass'}">Overall ${lvl} (${fmt(avg, 2)})</span></h3><div class="tw"><table class="t"><thead><tr><th>Category</th><th>Constraint</th><th>Rating</th><th>Notes / evidence</th><th>Linked calculation evidence</th></tr></thead><tbody>`;
    const ev = {S2: () => R.TOPO ? `Max slope ${f1(R.TOPO.res.smax)}°, ${f1(R.TOPO.res.steepPct)}% > 10°` : '', S3: () => R.FPL ? `Max platform raise ${f2(R.FPL.res.fillMax)} m` : '', S5: () => R.GEO ? `${R.GEO.res.softTop} BH with soft clay` : '', S6: () => R.GEO && R.GEO.res.hardDepth != null ? `Hard stratum ${f1(R.GEO.res.hardDepth)} m bgl` : '', S7: () => R.GEO ? `${R.GEO.res.corrosive} BH aggressive` : ''};
    SITE_ITEMS.forEach(s => { const v = P.site[s[0]] || {}; h += `<tr><td>${esc(s[1])}</td><td>${esc(s[2])}</td><td><select data-bind="site.${s[0]}.rating"${dis('edit')}>${['','Low','Moderate','High'].map(o => `<option${o === v.rating ? ' selected' : ''}>${o}</option>`).join('')}</select></td><td><input data-bind="site.${s[0]}.note" value="${esc(v.note || '')}"${dis('edit')}></td><td class="small muted">${esc(ev[s[0]] ? ev[s[0]]() : '')}</td></tr>`; });
    return h + '</tbody></table></div><p class="small muted">Weighted rating: Low = 1, Moderate = 2, High = 3. Ratings feed the Site Constraints chapter of the report.</p></div>';
  },
  topo(){
    const D = getDEM();
    return `<div class="card"><h3>DTM grid ${D.src === 'demo' ? '<span class="badge warn">synthetic demonstration grid</span>' : '<span class="badge pass">user DTM</span>'}</h3><div class="grid2"><div>${figDEM()}</div><div>${figSlopeBands()}
      <p class="small">Paste a gridded DTM (rows north → south, comma / space separated RL values) to replace the demonstration grid. Platforms (section C of Cut &amp; Fill) are defined in grid cells.</p>
      <div class="row"><label class="small">Cell size (m)</label><input id="demdx" class="num" style="width:80px" value="${D.dx}"></div>
      <textarea id="demtxt" rows="4" placeholder="12.1, 12.3, 12.6 …&#10;12.0, 12.2, 12.4 …"${dis('edit')}></textarea>
      <div class="row" style="margin-top:6px"><button class="sm" data-act="demimport"${dis('edit')}>Import DTM grid</button><button class="sm" data-act="demreset"${dis('edit')}>Restore demonstration grid</button></div></div></div></div>`;
  },
  lots(){ return `<div class="card"><h3>Lot schedule</h3>${editTable('tables.lots', [{k:'lot', l:'Lot'}, {k:'title', l:'Title'}, {k:'area', l:'Area (ha)', n:1}, {k:'status', l:'Status', t:'sel', o:['Verified','Pending','Disputed']}], {tpl:{lot:'', title:'', area:0, status:'Pending'}, perm:'edit'})}</div>`; },
  bh(){
    const bhs = P.tables.bh || [];
    let h = `<div class="card"><h3>Boreholes (measured data)</h3>${editTable('tables.bh', [{k:'id', l:'ID'}, {k:'lat', l:'Lat', n:1}, {k:'lon', l:'Lon', n:1}, {k:'rl', l:'RL (m)', n:1}, {k:'depth', l:'Depth (m)', n:1}, {k:'gwl', l:'GWL (m bgl)', n:1}, {k:'cbr', l:'CBR %', n:1}, {k:'res', l:'Resist. Ω·cm', n:1}, {k:'ph', l:'pH', n:1}, {k:'so4', l:'SO₄ mg/kg', n:1}, {k:'cl', l:'Cl mg/kg', n:1}], {perm:'edit', tpl:{id:'BH-NEW', lat:0, lon:0, rl:0, depth:10, gwl:2, cbr:5, res:3000, ph:6, so4:100, cl:50, layers:[[0,3,'CLAY','CLAY',5],[3,10,'SAND','SAND',20]]}})}</div>`;
    h += `<div class="card"><h3>Layers (from / to m bgl, description, type, SPT N)</h3><div class="grid2">${bhs.map((b, i) => `<div><b>${esc(b.id)}</b>${editTable(`tables.bh.${i}.layers`, [{k:'0', l:'From', n:1}, {k:'1', l:'To', n:1}, {k:'2', l:'Description', w:140}, {k:'3', l:'Type', t:'sel', o:['CLAY','SILT','SAND','ROCK']}, {k:'4', l:'SPT N', n:1}], {perm:'edit', tpl:[0,1,'','CLAY',5]})}</div>`).join('')}</div></div>`;
    return h + `<div class="card"><h3>Graphical soil profile</h3>${figSoil()}</div>`;
  },
  grading(){ return `<div class="card"><h3>Grading zone map</h3><div class="grid2"><div>${figGrading()}</div><div class="small"><p>Zones are computed per DTM cell from the N–S and E–W slopes against the mounting-system tolerance. Platform cells are excluded.</p><p><b>No grading</b> — within tolerance; <b>Moderate</b> — ≤ 1.5 × tolerance; <b>Major</b> — > 1.5 × tolerance.</p></div></div></div>`; },
  platforms(){ return `<div class="card"><h3>Platforms (grid cells; x → east, y → south from NW corner)</h3>${editTable('tables.platforms', [{k:'id', l:'ID'}, {k:'name', l:'Name', w:180}, {k:'x0', l:'x₀', n:1}, {k:'y0', l:'y₀', n:1}, {k:'w', l:'w (cells)', n:1}, {k:'h', l:'h (cells)', n:1}, {k:'auto', l:'Auto RL', t:'sel', o:[true, false]}, {k:'rl', l:'User RL', n:1}, {k:'gx', l:'Cross-fall %', n:1}], {perm:'edit', tpl:{id:'PF-NEW', name:'New platform', x0:5, y0:5, w:2, h:2, rl:0, gx:0.5, gy:0, auto:true}})}<div style="margin-top:8px">${figDEM()}</div></div>`; },
  hydro(){ return `<div class="card"><h3>Sub-catchments (pre / post development)</h3>${editTable('tables.sc', [{k:'id', l:'ID'}, {k:'area', l:'A (ha)', n:1}, {k:'preUse', l:'Pre land use', w:120}, {k:'cPre', l:'C pre', n:1}, {k:'postUse', l:'Post land use', w:140}, {k:'cPost', l:'C post', n:1}, {k:'L', l:'L overland (m)', n:1}, {k:'S', l:'S (%)', n:1}, {k:'nPre', l:'n* pre', n:1}, {k:'nPost', l:'n* post', n:1}, {k:'Lc', l:'L drain (m)', n:1}, {k:'Sc', l:'S drain (%)', n:1}], {perm:'edit', tpl:{id:'SC-N', area:5, preUse:'Scrub', cPre:0.4, postUse:'PV array', cPost:0.5, L:80, S:2, nPre:0.06, nPost:0.045, Lc:300, Sc:0.5}})}
      <div class="grid2" style="margin-top:8px"><div>${figIDF()}</div><div>${figCatch()}</div></div></div>`; },
  pilecmp(){
    const W = P.options.weights, S = P.options.scores, wsum = sum(Object.values(W).map(Number));
    const cap = {'Driven steel': R.PVP ? `${f1(R.PVP.res.Tall)} kN uplift` : '', 'Screw pile': R.HEL ? `${f1(R.HEL.res.Tall)} kN uplift` : '', 'Helical pile': R.HEL ? `${f1(R.HEL.res.Tall)} kN uplift` : '', 'Spun pile': R.DRV ? `${f0(R.DRV.res.Qall)} kN comp.` : ''};
    let h = `<div class="card"><h3>Pile option comparison (score 1–5; 5 = most favourable)</h3><div class="tw"><table class="t"><thead><tr><th>Criterion</th><th class="c">Weight</th>${PILE_OPTS.map(o => `<th class="c">${esc(o)}</th>`).join('')}</tr></thead><tbody>`;
    h += `<tr class="hd"><td>Calculated capacity (evidence)</td><td></td>${PILE_OPTS.map(o => `<td class="c small">${esc(cap[o] || 'not calculated')}</td>`).join('')}</tr>`;
    PILE_CRIT.forEach(([k, l]) => { h += `<tr><td>${esc(l)}</td><td><input class="num" data-num="1" data-bind="options.weights.${k}" value="${W[k]}" style="width:56px"${dis('edit')}></td>${PILE_OPTS.map(o => `<td><input class="num" data-num="1" data-bind="options.scores.${o}.${k}" value="${S[o][k]}" style="width:48px"${dis('edit')}></td>`).join('')}</tr>`; });
    if (wsum > 0){ const tot = PILE_OPTS.map(o => sum(PILE_CRIT.map(([k]) => (+W[k] || 0) * (+S[o][k] || 0))) / wsum); const best = Math.max(...tot);
      h += `<tr class="tot"><td>Weighted score</td><td class="c">${wsum}</td>${tot.map(t => `<td class="c">${fmt(t, 2)}${t === best ? ' ★' : ''}</td>`).join('')}</tr>`; }
    h += '</tbody></table></div>';
    h += wsum > 0 ? `<p class="small">Ranking based on <b>user-defined decision criteria</b> (weights). ★ = highest weighted score. Engineering basis: calculated capacities above and pile tests; final selection requires Engineer confirmation.</p>` : `<p class="small"><b>No option is declared preferred</b> — decision criteria (weights) have not been defined. Enter weights to compute a weighted ranking.</p>`;
    return h + '</div>';
  },
};

function pageHead(m, sub){ return `<div class="ph"><h1><span class="mno">${m.no}.</span>${esc(m.name)}</h1><span class="sub">${esc(sub || m.grp)}</span></div>`; }
const PAGES = {
  dash(m){
    const ids = Object.keys(R), pass = ids.filter(i => R[i].status === 'pass').length, fail = ids.filter(i => R[i].status === 'fail').length;
    const cs = costSummary(), mi = missingInfo(), hi = RISKS.filter(r => r.level === 'High').length;
    let h = pageHead(m, P.type === 'B' ? 'Type B — Solar Farm + BESS' : 'Type A — Solar Farm');
    if (P.sample) h += `<div class="demo" style="margin-bottom:10px">${DEMO_FLAG}</div>`;
    h += `<div class="grid4">${[[`${fmt(+P.info.mwac, 0)} MWac`, `${fmt(+P.info.mwp, 0)} MWp PV${P.type === 'B' ? ` · ${fmt(+P.info.bessMW, 0)} MW / ${fmt(+P.info.bessMWh, 0)} MWh BESS` : ''}`], [`${pass} / ${ids.length}`, 'Calculations compliant'], [fail, 'Calculations with non-compliance'], [`RM ${fmt(cs.total / 1e6, 2)} m`, 'C&S engineering estimate'], [hi, 'High design risks'], [TENDER.gaps.length, 'Tender scope gaps'], [TENDER.issues.length, 'Tender line issues'], [Object.values(mi.tags).reduce((a, b) => a + b.length, 0) + mi.docs.length, 'Outstanding information items']].map(([v, l]) => `<div class="kpi"><div class="v">${esc(v)}</div><div class="l">${esc(l)}</div></div>`).join('')}</div>`;
    const flow = [['Project info','m2'],['Location','m3'],['Documents','m5'],['Missing info','m5'],['Design basis','m15'],['Standards','m58'],['Inputs','m10'],['Calculation','m26'],['Checks','m64'],['Design','m16'],['Quantity','m48'],['Cost','m50'],['Reconciliation','m51'],['Risk','m54'],['Compliance','m57'],['Recommendation','m64'],['A4 report','m65']];
    h += `<div class="card" style="margin-top:12px"><h3>Workflow</h3><div class="row" style="gap:4px">${flow.map(([t, id], i) => `<a class="badge ${i < 3 ? 'pass' : 'a'}" href="#${id}" style="text-decoration:none">${esc(t)}</a>${i < flow.length - 1 ? '<span class="muted">→</span>' : ''}`).join('')}</div></div>`;
    h += `<div class="grid2"><div class="card"><h3>Module status</h3><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px">${MODULES.filter(modApplies).map(x => { const st = moduleStatus(x); return `<a href="#${x.id}" style="text-decoration:none;border:1px solid var(--bd);border-left:4px solid ${st === 'fail' ? 'var(--ng)' : st === 'pass' ? 'var(--ok)' : st === 'warn' ? '#D4A24A' : 'var(--bd2)'};padding:3px 6px;border-radius:3px;font-size:11.5px;color:var(--tx);background:#fff">${x.no}. ${esc(x.name)}</a>`; }).join('')}</div></div>

'use strict';
/* ==========================================================================
   APP — routing, rendering, events, actions, initialisation

function render(keepScroll){
  const y = window.scrollY;
  const m = MOD[ROUTE] && modApplies(MOD[ROUTE]) ? MOD[ROUTE] : MOD.m1; ROUTE = m.id;
  renderTop(); renderNav();
  let h;
  try { h = m.tech ? renderTech(m) : (PAGES[m.kind] ? PAGES[m.kind](m) : '<p>Not implemented</p>'); }
  catch(e){ console.error(e); h = `<div class="wbox"><b>Render error</b> — ${esc(e.message)}</div>`; }
  $('#main').innerHTML = h;
  document.title = `${m.no}. ${m.name} — C&S Tender Engineering Platform`;
  if (keepScroll) window.scrollTo(0, y); else window.scrollTo(0, 0);
}
function commit(msg){ runAll(); saveLocal(); render(true); if (msg) toast(msg); }


/* ---------- in-page dialogs (browser confirm/prompt are blocked in embedded / sandboxed frames) ---------- */
const FRAMED = (() => { try { return window.self !== window.top; } catch(e){ return true; } })();
let _dlg = null;
function askConfirm(msg, onYes, onNo){ _dlg = {yes: onYes, no: onNo}; modal('Please confirm', `<p>${esc(msg)}</p><div class="row"><button class="pri" data-act="dlgyes">Yes, proceed</button><button data-act="dlgno">Cancel</button></div>`); }
function askText(title, fields, onOk){ _dlg = {ok: onOk, fields}; modal(title, fields.map((f, i) => `<div style="margin-bottom:8px"><label class="small muted">${esc(f.l)}</label><input id="dlgf${i}" value="${esc(f.v || '')}"></div>`).join('') + `<div class="row"><button class="pri" data-act="dlgok">OK</button><button data-act="dlgno">Cancel</button></div>`); }
function doPrint(){
  if (!FRAMED){ window.print(); return; }
  const css = document.getElementById('appcss').textContent;
  const w = window.open('', '_blank');
  if (!w){ modal('Print', '<p>This page is embedded (e.g. Google Sites) and the browser blocked the print window. Use <b>Download HTML</b> and print that file, or open the platform in its own tab.</p>'); return; }
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(P.info.name)} — Report</title><style>${css}</style></head><body style="background:#fff">${reportHTML(P.repOpt)}</body></html>`); w.document.close(); setTimeout(() => { try { w.print(); } catch(e){} }, 600);
}
window.addEventListener('error', e => { const m = document.getElementById('main'); if (m && !m.querySelector('.fatal')) m.insertAdjacentHTML('afterbegin', `<div class="wbox fatal"><b>Script error</b> — ${esc(e.message)} (line ${e.lineno}). Please send this message to the developer.</div>`); });

/* ---------- events ---------- */
function parseVal(el){ if (el.dataset.bool) return el.checked; const v = el.value; if (el.dataset.num || el.classList.contains('num')){ const n = parseFloat(v); return isFinite(n) ? n : v === '' ? '' : v; } if (v === 'true') return true; if (v === 'false') return false; return v; }
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.cin){ const [cid, k] = el.dataset.cin.split('|'); const d = CALCS[cid].inputs.find(x => x.k === k); let v = el.value; if (!d.t || d.t === 'n'){ v = parseFloat(v); if (!isFinite(v)){ toast('Invalid number'); render(true); return; } } setInput(cid, k, v); commit(); return; }
  if (el.dataset.cconf){ const [cid, k] = el.dataset.cconf.split('|'); (P.conf[cid] = P.conf[cid] || {})[k] = el.value; audit('Confidence changed', `${CALCS[cid].no} · ${k} → ${el.value}`); commit(); return; }
  if (el.dataset.csrc){ const [cid, k] = el.dataset.csrc.split('|'); (P.src[cid] = P.src[cid] || {})[k] = el.value; audit('Source changed', `${CALCS[cid].no} · ${k}`); commit(); return; }
  if (el.dataset.rate){ if (!can('rates')) return; const v = parseFloat(el.value); P.rates[el.dataset.rate] = isFinite(v) ? v : BOQ_LIB[el.dataset.rate].rate; audit('Rate changed', `${el.dataset.rate} → ${P.rates[el.dataset.rate]}`); commit(); return; }
  if (el.dataset.bind){ const path = el.dataset.bind, old = getPath(P, path); const v = parseVal(el); setPath(P, path, v); if (path.startsWith('tables.dem')) _demCache = null; audit('Edited', `${path}: ${old === undefined ? '' : old} → ${v}`); commit(); return; }
  if (el.dataset.act === 'role'){ P.role = el.value; audit('Role changed', el.value); saveLocal(); render(true); toast('Role: ' + el.value); return; }
  if (el.dataset.act === 'settype'){ const nt = el.value; askConfirm('Switch project type? BESS modules, calculations, BOQ items, risks and report chapters will be ' + (nt === 'B' ? 'added.' : 'excluded.'), () => setType(nt), () => render(true)); return; }
});
function setType(v){ const el = {value: v};
    P.type = el.value; P.info.projType = el.value; if (el.value === 'A'){ P.info.bessMW = 0; P.info.bessMWh = 0; } else { P.info.bessMW = P.info.bessMW || 50; P.info.bessMWh = P.info.bessMWh || 200; if (!platforms().find(p => p.id === 'PF-BESS')) P.tables.platforms.push({id:'PF-BESS', name:'BESS compound', x0:37, y0:47, w:8, h:6, rl:0, gx:0.5, gy:0, auto:true}); }
    P.reg.drawings = DRAWING_ROWS.filter(r => !r[3] || r[3] === P.type).map(r => Object.assign({no:r[0], title:r[1], disc:r[2], rev:'-', status:'Required', resp:'C&S consultant'}, (P.reg.drawings.find(d => d.no === r[0]) || {})));
    audit('Project type changed', el.value); closeModal(); commit('Project type ' + el.value); }
document.addEventListener('click', e => {
  const lnk = e.target.closest('a[href^="#"]');
  if (lnk && !e.target.closest('[data-act]')){ e.preventDefault(); const tgt = lnk.getAttribute('href').slice(1); $('#nav').classList.remove('open');
    const scId = lnk.dataset.scroll; if (MOD[tgt] && tgt !== ROUTE) goRoute(tgt, !scId);
    if (scId) setTimeout(() => { const t = document.getElementById(scId); if (t) t.scrollIntoView({behavior:'smooth', block:'start'}); }, 30);
    return; }
  const a = e.target.closest('[data-act]'); if (!a || a.tagName === 'SELECT') return;
  const act = a.dataset.act, id = a.dataset.id;
  switch (act){
    case 'closemodal': closeModal(); break;
    case 'togglenav': $('#nav').classList.toggle('open'); break;
    case 'goto': goRoute(id, true); break;
    case 'save': toast(saveLocal() ? 'Saved in this browser' : 'Browser storage unavailable — use Export JSON'); break;
    case 'export': download(`${(P.info.number || 'project').replace(/[^\w-]+/g, '_')}_CS_${today()}.json`, JSON.stringify(P, null, 1), 'application/json'); audit('Exported JSON', ''); break;
    case 'import': { const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json'; inp.onchange = () => { const f = inp.files[0]; if (!f) return; f.text().then(t => { try { const o = JSON.parse(t); if (o.app !== 'CS-Solar-Tender-Platform') throw new Error('Not a platform project file'); P = upgrade(o); _demCache = null; audit('Imported JSON', f.name); runAll(); saveLocal(); render(); toast('Project imported'); } catch(err){ toast('Import failed: ' + err.message); } }); }; inp.click(); break; }
    case 'newproj': modal('New project', `<p>Select project type. The two workflows are fully separated (tabs, calculations, BOQ, risks, report, standards, authority requirements).</p><div class="grid2"><div class="card"><h3>Type A — Solar Farm</h3><button data-act="create" data-t="A" data-s="1">Demonstration sample</button> <button data-act="create" data-t="A" data-s="0">Blank project</button></div><div class="card"><h3>Type B — Solar Farm + BESS</h3><button data-act="create" data-t="B" data-s="1">Demonstration sample (100 MWac + 50 MW / 200 MWh)</button> <button data-act="create" data-t="B" data-s="0">Blank project</button></div></div><p class="small wbox">The current project is replaced. Export JSON first if needed.</p>`); break;
    case 'create': { P = newProject(a.dataset.t, a.dataset.s === '1'); _demCache = null; runAll(); if (P.sample) P.tender = genSampleTender(); audit('Project created', `Type ${P.type}${P.sample ? ' (sample)' : ''}`); runAll(); saveLocal(); closeModal(); goRoute('m1', true); toast('Project created'); break; }
    case 'togglelink': { if (!can('edit')) return; const u = P.unlink[a.dataset.cid] = P.unlink[a.dataset.cid] || {}; const k = a.dataset.k; u[k] = !u[k];
      if (u[k]){ const d = CALCS[a.dataset.cid].inputs.find(x => x.k === k); const cur = R[a.dataset.cid].I[k]; (P.inp[a.dataset.cid] = P.inp[a.dataset.cid] || {})[k] = cur; (P.conf[a.dataset.cid] = P.conf[a.dataset.cid] || {})[k] = 'Consultant Assumption'; }
      audit(u[k] ? 'Link overridden' : 'Link restored', `${CALCS[a.dataset.cid].no} · ${k}`); commit(); break; }
    case 'issue': { if (!can('edit')) return; askText(`Issue ${CALCS[id].no}`, [{l:'Revision code', v: nextRev(calcRev(id))}, {l:'Revision description', v:'Issued for tender review'}], ([next, desc]) => { if (!next) return; issueCalc(id, next, desc); closeModal(); commit('Issued ' + CALCS[id].no + ' Rev ' + next); }); break; }
    case 'checkcalc': { if (!can('check')) return; const m = P.calcMeta[id] = P.calcMeta[id] || {revs: []}; m.checkedBy = m.checkedBy ? '' : `${P.user} (${today()})`; audit(m.checkedBy ? 'Calculation checked' : 'Check removed', CALCS[id].no); commit(); break; }
    case 'resetcalc': { if (!can('edit')) return; askConfirm(`Reset all inputs of ${CALCS[id].no} to defaults? (logged in audit trail)`, () => { closeModal(); delete P.inp[id]; delete P.conf[id]; delete P.src[id]; delete P.unlink[id]; audit('Calculation reset', CALCS[id].no); commit('Reset'); }); break; }
    case 'sheet': modal(`${CALCS[id].no} — Calculation sheet`, `<div class="row noprint" style="margin-bottom:8px"><button class="sm" data-act="printsheet" data-id="${id}">Print sheet (A4)</button></div><div class="report-body" id="sheetbody" style="border:1px solid var(--bd);padding:14px">${calcSheetHTML(id)}</div>`); break;
    case 'printsheet': printHTML(`<div class="report-body"><div class="rpage"><h2>${esc(CALCS[id].no)} — ${esc(CALCS[id].title)}</h2>${calcSheetHTML(id)}</div></div>`); break;
    case 'revhist': { const m = P.calcMeta[id] || {}; modal(`${CALCS[id].no} — Revision history`, (m.revs || []).length ? `<table class="t"><thead><tr><th>Rev</th><th>Date</th><th>Description</th><th>By</th><th>Status at issue</th><th>Input fingerprint</th></tr></thead><tbody>${m.revs.map(r => `<tr><td>${esc(r.rev)}</td><td>${esc(r.date)}</td><td>${esc(r.desc)}</td><td>${esc(r.by)}</td><td>${esc(r.status)}</td><td class="small muted">${crc32(new TextEncoder().encode(r.hash)).toString(16)}</td></tr>`).join('')}</tbody></table>${calcModified(id) ? '<p class="wbox">Inputs have changed since the last issue — re-issue required.</p>' : ''}` : '<p>Not yet issued (P0 working calculation).</p>'); break; }
    case 'trace': { const r = R[id], k = a.dataset.k, rl = r.resList.find(x => x.key === k); const c = CALCS[id], mod = modOfCalc(id);
      const upto = r.steps.slice(0, rl.step + 1).filter(s => s.t === 'e').slice(-6);
      modal('Traceability — ' + rl.label, `<p class="small">Source → Input → Formula → Result → Report</p><h4>1. Sources & inputs</h4><table class="t"><thead><tr><th>Symbol</th><th>Parameter</th><th class="n">Value</th><th>Unit</th><th>Source</th><th>Confidence</th></tr></thead><tbody>${c.inputs.filter(d => d.k).map(d => { const m = r.meta[d.k] || {}; return `<tr><td><i>${esc(d.sym || '')}</i></td><td>${esc(d.l)}</td><td class="n">${isNum(r.I[d.k]) ? fmt(r.I[d.k]) : esc(r.I[d.k])}</td><td>${esc(d.u || '')}</td><td class="small">${esc(inputSrc(id, d, m) || '—')}</td><td>${esc(inputConf(id, d, m.linked))}</td></tr>`; }).join('')}</tbody></table>
        <h4>2. Formula & calculation</h4><div class="steps">${upto.map(stepHTML).join('')}</div><h4>3. Result</h4><p><b>${esc(rl.label)} = ${fmt(rl.val, rl.dp)} ${esc(rl.unit || '')}</b> (${esc(c.no)}, Rev ${esc(calcRev(id))})</p>
        <h4>4. Reported in</h4><ul class="tight"><li>Module ${mod ? mod.no + '. ' + esc(mod.name) : '—'} — sections C, J</li><li>Report — technical chapter for ${mod ? esc(mod.name) : '—'} (Results, Compliance) and Full Calculation Sheets (${esc(c.no)})</li>${Object.keys(R).filter(o => CALCS[o].inputs.some(d => d.link === id + '.' + k)).map(o => `<li>Used by ${esc(CALCS[o].no)} ${esc(CALCS[o].title)}</li>`).join('')}</ul>`); break; }
    case 'addrow': { const arr = getPath(P, a.dataset.path) || []; if (!getPath(P, a.dataset.path)) setPath(P, a.dataset.path, arr); const t = JSON.parse(a.dataset.tpl); if (t && typeof t === 'object' && !Array.isArray(t) && 'id' in t && !t.id) t.id = uid(); arr.push(t); audit('Row added', a.dataset.path); commit(); break; }
    case 'delrow': { const dp = a.dataset.path, di = +a.dataset.i; askConfirm('Delete this row? (logged in audit trail)', () => { closeModal(); const arr = getPath(P, dp); const rm = arr.splice(di, 1); audit('Row deleted', `${dp}[${di}] ${JSON.stringify(rm[0]).slice(0, 80)}`); commit(); }); break; }
    case 'demimport': { const txt = ($('#demtxt') || {}).value || ''; const dx = parseFloat(($('#demdx') || {}).value) || 25; const rows = txt.trim().split(/\r?\n/).map(l => l.trim().split(/[\s,;]+/).map(Number)).filter(r => r.length > 1 && r.every(isFinite));
      if (rows.length < 3 || rows.some(r => r.length !== rows[0].length)){ toast('Grid must be rectangular with ≥ 3 rows'); return; } P.tables.dem = {nx: rows[0].length, ny: rows.length, dx, z: rows, src: 'user'}; _demCache = null; audit('DTM imported', `${rows[0].length}×${rows.length} @ ${dx} m`); commit('DTM imported'); break; }
    case 'demreset': P.tables.dem = null; _demCache = null; audit('DTM reset to demonstration', ''); commit('Demonstration grid restored'); break;
    case 'csvboq': { const rows = boqRows(); download('BOQ.csv', toCSV(['Item','Bill','Description','Unit','Quantity','Rate','Amount','Calculation Reference','Drawing Reference','Assumption','Confidence','Remarks'], rows.map(r => [r.key, r.bill, r.desc, r.unit, r.qty.toFixed(3), r.rate.toFixed(2), r.amount.toFixed(2), r.calcs, r.dwg, r.basis, r.conf, r.remarks])), 'text/csv'); break; }
    case 'csvrecon': download('Tender_Reconciliation.csv', toCSV(['Item','Description','Required Qty','Tender Qty','Difference','Required Scope','Tender Scope','Tender Rate','Engineering Rate','Variance (RM)','Issues'], TENDER.rows.map(r => [r.key, r.desc, r.rq.toFixed(2), r.tq.toFixed(2), r.diff.toFixed(2), r.rscope, r.tscope, r.trate.toFixed(2), r.erate.toFixed(2), r.variance.toFixed(2), r.issues.join('; ')])), 'text/csv'); break;
    case 'gentender': if (!can('tender')) return; askConfirm('Replace the quotation with a regenerated demonstration quotation?', () => { closeModal(); P.tender = genSampleTender(); audit('Tender regenerated', 'demonstration'); commit(); }); break;
    case 'print': doPrint(); break;
    case 'dlgyes': { const d = _dlg; _dlg = null; closeModal(); if (d && d.yes) d.yes(); break; }
    case 'dlgno': { const d = _dlg; _dlg = null; closeModal(); if (d && d.no) d.no(); break; }
    case 'dlgok': { const d = _dlg; if (!d) break; const vals = d.fields.map((f, i) => (document.getElementById('dlgf' + i) || {}).value || ''); _dlg = null; d.ok(vals); break; }
    case 'docx': { toast('Building Word document…'); exportDocx(P.repOpt).then(b => { download(`${(P.info.number || 'Report').replace(/[^\w-]+/g, '_')}_CS_Tender_Report.docx`, b); audit('Report exported', '.docx'); toast('Word document downloaded'); }).catch(err => { console.error(err); toast('DOCX export failed: ' + err.message); }); break; }
    case 'htmlrep': { const css = document.getElementById('appcss').textContent; download(`${(P.info.number || 'Report').replace(/[^\w-]+/g, '_')}_CS_Tender_Report.html`, `<!doctype html><html lang="en"><head><meta charset="utf-8"><title>${esc(P.info.name)} — C&S Tender Engineering Report</title><style>${css}</style></head><body style="background:#E9E6E2">${reportHTML(P.repOpt)}</body></html>`, 'text/html'); break; }
    case 'projrev': { const d = ($('#revdesc') || {}).value || 'Project revision'; const n = nextRev((P.revisions.slice(-1)[0] || {}).rev || 'P0'); P.revisions.push({rev: n, date: today(), desc: d, by: `${P.user} (${P.role})`, snapshot: JSON.stringify({inp: P.inp, rates: P.rates, tender: P.tender}).length}); P.reg.reports.forEach(r => r.rev = n); audit('Project revision issued', n + ' — ' + d); commit('Project revision ' + n); break; }
    case 'addconstruct': { const v = ($('#cnew') || {}).value; if (!v) return; P.constructability[v] = {flag: true, note: 'User-added item — review'}; commit(); break; }
  }
});
function goRoute(id, top){ ROUTE = id; try { if (!FRAMED) history.replaceState(null, '', '#' + id); } catch(e){} render(!top); if (top) try { window.scrollTo(0, 0); } catch(e){} }
window.addEventListener('hashchange', () => { let h = ''; try { h = location.hash.slice(1); } catch(e){} if (MOD[h] && h !== ROUTE){ ROUTE = h; render(); } });
function nextRev(r){ const m = /^([A-Z]+)(\d+)$/.exec(r || 'P0'); if (m) return m[1] + (+m[2] + 1); if (/^[A-Z]$/.test(r)) return String.fromCharCode(r.charCodeAt(0) + 1); return 'P1'; }
function printHTML(inner){ const w = window.open('', '_blank'); if (!w){ toast('Pop-up blocked — use the Report Generator print instead'); return; } w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Calculation sheet</title><style>${document.getElementById('appcss').textContent}</style></head><body style="background:#fff">${inner}</body></html>`); w.document.close(); setTimeout(() => w.print(), 400); }
function upgrade(o){ const b = newProject(o.type || 'B', !!o.sample); ['reg','tables'].forEach(k => o[k] = Object.assign({}, b[k], o[k] || {})); return Object.assign(b, o); }

/* ---------- init ---------- */
function init(){
  const saved = loadLocal();
  if (saved && saved.app === 'CS-Solar-Tender-Platform'){ P = upgrade(saved); }
  else { P = newProject('B', true); runAll(); P.tender = genSampleTender(); }
  runAll();
  let h = ''; try { h = location.hash.slice(1); } catch(e){} if (MOD[h]) ROUTE = h;
  render();
}
document.addEventListener('DOMContentLoaded', init);

</script>
